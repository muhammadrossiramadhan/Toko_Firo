services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: toko_firo_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8080"
    env_file:
      - .env
    environment:
      - PUID=1000
      - PGID=1000
      - DB_HOST=db
      - DB_PORT=3306
    volumes:
      - .:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini:ro
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 128M
    networks:
      - toko_firo_network

  db:
    image: mariadb:11.4
    container_name: toko_firo_db
    restart: unless-stopped
    ports:
      - "${FORWARD_DB_PORT:-3307}:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MARIADB_DATABASE: ${DB_DATABASE:-toko_firo}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mariadb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p$${MARIADB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - toko_firo_network

volumes:
  db_data:
    driver: local

networks:
  toko_firo_network:
    driver: bridge
